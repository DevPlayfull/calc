<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fraction Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .calculator {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #333;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        .fraction-inputs {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fraction-line {
            font-size: 20px;
            font-weight: bold;
            color: #777;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h2>Fraction Calculator</h2>
    
    <!-- First Fraction -->
    <div class="input-group">
        <label>First Fraction:</label>
        <div class="fraction-inputs">
            <input type="number" id="num1" placeholder="Num">
            <span class="fraction-line">/</span>
            <input type="number" id="den1" placeholder="Den" value="1">
        </div>
    </div>
    
    <!-- Operation Selector -->
    <div class="input-group">
        <label for="operation">Operation:</label>
        <select id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="x">x</option>
            <option value="/">/</option>
        </select>
    </div>
    
    <!-- Second Fraction -->
    <div class="input-group">
        <label>Second Fraction:</label>
        <div class="fraction-inputs">
            <input type="number" id="num2" placeholder="Num">
            <span class="fraction-line">/</span>
            <input type="number" id="den2" placeholder="Den" value="1">
        </div>
    </div>
    
    <button onclick="calculate()">Calculate</button>
    <div class="result" id="result">Result: 0</div>
</div>

<script>
    // Helper function to find Greatest Common Divisor (GCD) for simplifying fractions
    function gcd(a, b) {
        return b === 0 ? Math.abs(a) : gcd(b, a % b);
    }

    // Function to reduce fractions to their lowest terms
    function reduceFraction(numerator, denominator) {
        if (denominator === 0) return { error: "Error: Denominator cannot be zero." };
        
        // Handle negative signs cleanly
        if (denominator < 0) {
            numerator = -numerator;
            denominator = -denominator;
        }
        
        const commonDivisor = gcd(numerator, denominator);
        numerator /= commonDivisor;
        denominator /= commonDivisor;
        
        if (denominator === 1) {
            return `${numerator}`;
        }
        return `${numerator}/${denominator}`;
    }

    function calculate() {
        const resultDiv = document.getElementById('result');

        // 1. Get values from UI inputs
        const n1 = parseInt(document.getElementById('num1').value);
        const d1 = parseInt(document.getElementById('den1').value);
        const operation = document.getElementById('operation').value;
        const n2 = parseInt(document.getElementById('num2').value);
        const d2 = parseInt(document.getElementById('den2').value);

        // Input validation
        if (isNaN(n1) || isNaN(d1) || isNaN(n2) || isNaN(d2)) {
            resultDiv.textContent = "Please enter integers in all fields.";
            return;
        }
        if (d1 === 0 || d2 === 0) {
            resultDiv.textContent = "Error: Denominators cannot be zero.";
            return;
        }

        let resNum, resDen;

        // 2. Perform fraction math arithmetic logic
        if (operation === "+") {
            resNum = (n1 * d2) + (n2 * d1);
            resDen = d1 * d2;
        } else if (operation === "-") {
            resNum = (n1 * d2) - (n2 * d1);
            resDen = d1 * d2;
        } else if (operation === "x") {
            resNum = n1 * n2;
            resDen = d1 * d2;
        } else if (operation === "/") {
            if (n2 === 0) {
                resultDiv.textContent = "Error: Cannot divide by zero.";
                return;
            }
            resNum = n1 * d2;
            resDen = d1 * n2;
        } else {
            resultDiv.textContent = "Invalid operation.";
            return;
        }

        // 3. Simplify and display result
        const reduction = reduceFraction(resNum, resDen);
        if (reduction.error) {
            resultDiv.textContent = reduction.error;
        } else {
            // Calculates decimal value equivalent for reference
            const decimalVal = (resNum / resDen).toFixed(4).replace(/\.?0+$/, "");
            resultDiv.innerHTML = `Result: ${reduction} <br><span style="font-size:14px; font-weight:normal; color:#666;">(${decimalVal})</span>`;
        }
    }
</script>

</body>
</html>
