<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        #score-board {
            font-size: 1.5rem;
            margin-bottom: 20px;
            background: #2a2a2a;
            padding: 10px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        #score {
            font-weight: bold;
            color: #4caf50;
        }

        canvas {
            background-color: #000000;
            border: 4px solid #333333;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .game-over-text {
            color: #f44336;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>SNAKE</h1>
    <div id="score-board">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        // Grid and game dimensions
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // Game speed (lower = faster)
        const gameSpeed = 100; 

        // Snake setup
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        // Velocity components
        let dx = 1;
        let dy = 0;

        // Food coordinates
        let foodX;
        let foodY;

        // Score tracker
        let score = 0;

        // Game loop control
        let gameInterval;
        let changingDirection = false;

        // Start the game mechanics
        main();
        generateFood();

        function main() {
            if (hasGameEnded()) {
                scoreElement.innerHTML = `<span class="game-over-text">${score} — Game Over! Press Refresh to Restart</span>`;
                return;
            }

            changingDirection = false;
            gameInterval = setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                // Repeat loop
                main();
            }, gameSpeed);
        }

        // Clear the canvas on every tick
        function clearCanvas() {
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Draw snake parts
        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter green than the body
                ctx.fillStyle = index === 0 ? "#4caf50" : "#2e7d32";
                ctx.strokeStyle = "#000000";
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
                ctx.strokeRect(part.x * gridSize, part.y * gridSize, gridSize, gridSize);
            });
        }

        // Advance snake position
        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            const hasEatenFood = snake[0].x === foodX && snake[0].y === foodY;
            if (hasEatenFood) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        // Generate random coordinates for food
        function generateFood() {
            foodX = Math.floor(Math.random() * tileCount);
            foodY = Math.floor(Math.random() * tileCount);

            // Ensure food doesn't spawn inside the snake body
            snake.forEach(part => {
                const hasSpawnedOnSnake = part.x === foodX && part.y === foodY;
                if (hasSpawnedOnSkull) generateFood();
            });
        }

        // Draw food on canvas
        function drawFood() {
            ctx.fillStyle = "#f44336"; // Red apple
            ctx.fillRect(foodX * gridSize, foodY * gridSize, gridSize, gridSize);
        }

        // Collision logic
        function hasGameEnded() {
            // Self-collision check
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }

            // Wall-collision check
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= tileCount;
            const hitToptWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= tileCount;

            return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
        }

        // Event listener for user controls
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            const LEFT_KEY = 37;
            const UP_KEY = 38;
            const RIGHT_KEY = 39;
            const DOWN_KEY = 40;

            // Prevent simultaneous multi-directional input bugs
            if (changingDirection) return;

            const keyPressed = event.keyCode;
            const goingUp = dy === -1;
            const goingDown = dy === 1;
            const goingRight = dx === 1;
            const goingLeft = dx === -1;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -1;
                changingDirection = true;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = 1;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = 1;
                changingDirection = true;
            }
        }
    </script>
</body>
</html>
